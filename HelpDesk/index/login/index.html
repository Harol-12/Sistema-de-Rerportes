<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── FONDO CON SLIDESHOW ── -->
    <div class="bg-slideshow">
        <div class="bg-slide active"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>
    <div class="bg-overlay"></div>

    <!-- ── PÁGINA ── -->
    <div class="page-wrapper">

        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="navbar-brand">
                
                <div class="brand-text">
                    <div class="brand-name"></div>
                    <div class="brand-sub"></div>
                </div>
            </div>
            <a href="../RecepcionTicket/recepcion_tickets.html" class="btn-back">
                ← Reportar Ticket
            </a>
        </nav>

        <!-- HERO -->
        <header class="hero">
            
            <h1>Hospital Regional de Cobán</h1>
            <div class="hero-badge">Gestión Informática Hospitalaria</div>
            <p class="hero-subtitle"></p>
        </header>

        <!-- CARD DE LOGIN -->
        <main class="login-wrapper">
            <div class="login-card">

                <div class="login-card-header">
                    <div class="login-card-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <span class="login-card-title">Iniciar Sesión</span>
                </div>

                <div class="login-card-body">
                   

                    <form id="login-form" novalidate>

                        <div class="input-group" id="group-usuario">
                            <label for="username">Usuario o Correo</label>
                            <div class="input-icon-wrapper">
                                <input type="text" id="username" name="username"
                                    placeholder="Usuario" required autocomplete="username">
                                <span class="input-status-icon"></span>
                            </div>
                            <span class="field-msg">⚠ Este campo es obligatorio</span>
                        </div>

                        <div class="input-group" id="group-password">
                            <label for="password">Contraseña</label>
                            <div class="input-icon-wrapper">
                                <input type="password" id="password" name="password"
                                    placeholder="password" required autocomplete="current-password">
                                <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar contraseña">
                                    <!-- ojo abierto -->
                                    <svg id="icon-eye-open" viewBox="0 0 24 24" style="display:block">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <!-- ojo cerrado -->
                                    <svg id="icon-eye-closed" viewBox="0 0 24 24" style="display:none">
                                        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                                        <line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="field-msg">⚠ Este campo es obligatorio</span>
                        </div>

                        <div id="login-error" class="login-msg error" style="display:none"></div>

                        <button type="submit" class="submit-btn" id="submit-btn">
                            Entrar al Sistema
                            <svg viewBox="0 0 24 24">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </button>

                    </form>

                    <div class="footer-links">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- INDICADORES DEL SLIDESHOW -->
    <div class="slide-indicators" id="indicators"></div>

    <script src="script.js"></script>
</body>
</html>
